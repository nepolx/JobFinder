services:

  postgres:
    image: postgres:16
    container_name: vacancybot-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-vacancybot}
      POSTGRES_USER: ${POSTGRES_USER:-vacancybot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-vacancybot}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-vacancybot} -d ${POSTGRES_DB:-vacancybot}"]
      interval: 5s
      timeout: 3s
      retries: 10

  rabbitmq:
    image: rabbitmq:3.13-management
    container_name: vacancybot-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-guest}
    ports:
      - "5672:5672"     # для сервисов
      - "15672:15672"   # веб-интерфейс: http://localhost:15672
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7
    container_name: vacancybot-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  db-service:
    build:
      context: .
      dockerfile: db-service/Dockerfile
    container_name: vacancybot-db-service
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-vacancybot}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-vacancybot}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-vacancybot}
    ports:
      - "8081:8081"
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:8081/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s

  # Опрашивает trudvsem.ru, отправляет вакансии в db-service, публикует события в RabbitMQ.
  # Запускать только один экземпляр. Базы и Redis ему не нужны.
  worker-service:
    build:
      context: .
      dockerfile: worker-service/Dockerfile
    container_name: vacancybot-worker
    depends_on:
      db-service:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    environment:
      WORKER_DBSERVICE_BASEURL: http://db-service:8081
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_PORT: 5672
      SPRING_RABBITMQ_USERNAME: ${RABBITMQ_USER:-guest}
      SPRING_RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-guest}
      WORKER_EVENTS_QUEUE: vacancy.events
    ports:
      - "8082:8082"     # только /actuator/health и /actuator/info
    dns:
      - 8.8.8.8
      - 1.1.1.1

  # Читает очередь vacancy.events, подбирает получателей в базе, отправляет в Telegram.
  # Порт не слушает. Объявляет очередь vacancy.events при старте.
  notifier-service:
    build:
      context: ./notifier-service
    container_name: vacancybot-notifier
    depends_on:
      db-service:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_started
    environment:
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-vacancybot}
      DB_USER: ${POSTGRES_USER:-vacancybot}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-vacancybot}
      REDIS_HOST: redis
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-guest}
      EVENTS_QUEUE: vacancy.events

  # Telegram-бот. Принимает обновления по webhook (POST /webhook) и ходит в db-service по REST.

  bot-service:
    build:
      context: .
      dockerfile: bot-service/Dockerfile
    container_name: vacancybot-bot
    depends_on:
      db-service:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      BOT_WEBHOOK_URL: ${BOT_WEBHOOK_URL}
      BOT_WEBHOOK_SECRET: ${BOT_WEBHOOK_SECRET:-}
      BOT_SUPPORT_CONTACT: ${BOT_SUPPORT_CONTACT:-}
      DB_SERVICE_URL: http://db-service:8081
      BOT_STUBS_ENABLED: "false"
      BOT_SESSION_STORE: redis
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
    ports:
      - "8080:8080"     # /webhook и /actuator/health

volumes:
  pgdata: