services:
  postgres:
    image: postgres:16
    container_name: vacancybot-postgres
    environment:
      POSTGRES_DB: vacancybot
      POSTGRES_USER: vacancybot
      POSTGRES_PASSWORD: vacancybot
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata: