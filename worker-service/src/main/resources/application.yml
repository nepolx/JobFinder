server:
  port: 8082
spring:
  application:
    name: worker-service
  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest
  data:
    redis:
      host: localhost
      port: 6379
  worker:
    trudvsem:
      base-url: http://opendata.trudvsem.ru
      page-size: 100
      connect-timeout: 5s
      read-timeout: 10s
clients:
  db-service:
    base-url: http://localhost:8081
management:
  endpoints:
    web:
      exposure:
        include: health,info
