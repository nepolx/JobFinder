server:
  port: 8082
spring:
  application:
    name: worker-service
  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest
  data:
    redis:
      host: localhost
      port: 6379
  worker:
    trudvsem:
      base-url: http://opendata.trudvsem.ru
      page-size: 100
      connect-timeout: 5s
      read-timeout: 10s
    sync:
      window-size: 1h
      max-reload-attempts: 2
      max-retries: 3
      retry-base-delay: 1s
      pause-between-requests: 100ms
    db-service:
      base-url: http://localhost:8081
      connect-timeout: 2s
      read-timeout: 30s
clients:
  db-service:
    base-url: http://localhost:8081
management:
  endpoints:
    web:
      exposure:
        include: health,info
